# syntax=docker/sandbox-kit:3
#
# Proves the Record.Ports-vs-live-ListPorts question (see the design doc's
# "Ports" section). The `# syntax=` line must stay first: a v3 kit builds
# through BuildKit, and without it the file parses as a Dockerfile.
#
# sbx v0.51.0 runs the built-in agents from v3 kits and refuses to mix a v1/v2
# kit into one, so this is a v3 kit. v3 has no top-level `ports`; a port is a
# com.docker.sandbox/port@1 capability with config.container. `kit inspect
# --json` still reports it as a top-level `ports` list. v3 has no `name`
# either: inspect reports the directory name.
#
# Container port 18081 is arbitrary but must not collide with a port another
# fixture or test in this package publishes; the host port the daemon assigns
# is ephemeral and never asserted on.
schemaVersion: "3"
kind: mixin
description: Fixture kit for the Record.Ports-vs-live-read integration test.
capabilities:
  - type: com.docker.sandbox/port@1
    config:
      container: 18081
